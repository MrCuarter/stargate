<script>window.SG_EJ={"ejemplos": {"A0": {"titulo": "Carmen se presenta en 55 segundos, grabada con el móvil", "texto": "Carmen, maestra de 4.º de Primaria en un colegio de Zaragoza, se grabó con el móvil en su casa, del tirón y sin guion: «Soy Carmen, llevo doce años con niños de 9 y 10 años y me conecto desde Zaragoza. Me metí en educación por mi maestra de 5.º. Me encanta Genially y sufro con las hojas de cálculo. Un dato curioso: toco la gaita». Duró 55 segundos. Lo publicó en la sección «Preséntate» del padlet de la clase, con su alias (Capella) como título y «Capitán:» más el nombre de su profe en la primera línea. Después copió el enlace de su publicación (⋮ → «Copiar el enlace a la publicación») y lo pegó en el reto."}, "L0": {"titulo": "Andrés deja hecha en clase la programación de «La fotosíntesis» (2.º ESO)", "texto": "Andrés, profesor de Biología y Geología de 2.º de ESO, siguió en directo la herramienta que enseñó su Comandante y, en quince minutos, dejó hecha la programación de su unidad «La fotosíntesis»: el grupo y su nivel, tres objetivos, los contenidos, cinco actividades en orden y cómo las evalúa. No está terminada —le faltan los tiempos y la atención a la diversidad—, pero ya existe. Compartió el documento con permiso de lectura y pegó el enlace en el reto. De esa misma unidad saldrán sus dos Actividades.", "detalle": ["Lo mínimo: nivel, área, objetivos, contenidos, actividades y evaluación.", "No tiene que estar terminada: tiene que existir, y ser de una unidad real de tu aula.", "Si no pudiste venir, vale cualquier herramienta: un documento, una plantilla o una IA que te ayude a ordenarla."]}, "L1": {"titulo": "Pilar convierte su boceto del aparato circulatorio en una infografía con IA", "texto": "Pilar, maestra de 6.º de Primaria, trajo a clase el boceto a lápiz del recorrido de la sangre que dibuja cada año en la pizarra y se lo pidió a Microsoft Designer convertido en infografía con un prompt que dice contexto, tipo de imagen y finalidad. La primera versión traía etiquetas inventadas en inglés, así que iteró: «solo seis etiquetas, en español y con letra grande». Eligió la segunda y lo justificó en dos líneas: «Se lee desde el fondo del aula y distingue por color la sangre con y sin oxígeno, que es justo lo que evalúo». Después hizo en Canva un logo circular con un corazón y la palabra «PULSO» dentro. Subió el boceto y la versión elegida, el antes y el después, y pegó la captura en el reto.", "detalle": ["Partió de su boceto: no empezó de cero, empezó de lo que ya tenía a medias.", "Prompt: «Eres ilustrador de materiales escolares. Para una clase de 6.º de Primaria sobre el aparato circulatorio, crea una infografía vertical del recorrido de la sangre (corazón, pulmones y resto del cuerpo) con flechas rojas y azules. Finalidad: que el alumnado explique el recorrido con sus palabras».", "Iteración: «Solo seis etiquetas, en español, letra grande y fondo blanco».", "Criterio docente, en dos líneas: por qué esa versión y no la otra.", "Logo: hecho en Canva, con la palabra clave «PULSO» bien visible."], "imagen": "L1.jpg", "imagen_alt": "Las dos versiones de la infografía del aparato circulatorio (la primera con etiquetas en inglés, la segunda elegida) y el logo circular «PULSO»."}, "B1": {"titulo": "Lucía abre su Bitácora en Google Sites y publica sus recursos creados con IA", "texto": "Lucía, profesora de Biología y Geología de 3.º de ESO en un instituto de Murcia, creó su Bitácora en Google Sites y la llamó «Bitácora de Lucía · MUTECD». La personalizó con el verde de su departamento y una foto suya en el laboratorio, y dejó el menú preparado: Quién soy, Actividad 1, Actividad 2 y sus experiencias. Publicó la primera, «Recursos creados con IA»: la infografía de la célula de su relámpago y un audio de dos minutos para repasar sus partes, cada uno con su contexto, su reflexión y su autoevaluación. Pulsó «Publicar», abrió el enlace en una ventana de incógnito para comprobar que se veía sin su cuenta y lo pegó en el reto y en su BIO de la Nave.", "detalle": ["Alternativa rápida: duplicar la plantilla oficial de Genially y cambiar colores, foto y textos.", "No hace falta que esté llena: basta con la portada y la primera experiencia.", "Si la cuenta del centro no deja publicar en abierto, mejor crearla con una cuenta personal.", "Comprobación clave: el enlace se abre en incógnito sin pedir permiso."], "imagen": "B1.jpg", "imagen_alt": "La portada de la Bitácora de Lucía en Google Sites: cabecera verde, menú de cinco páginas y la página «Quién soy» con su foto."}, "X1": {"titulo": "Rosa entrega su Actividad 1 y la marca en la Nave al enviarla", "texto": "Rosa, profesora de Inglés de 1.º de Bachillerato, diseñó una actividad de expresión oral a partir de una imagen creada con IA: una calle de su ciudad en 2050 que el alumnado describe y compara con su barrio usando will y be going to. Su PDF (4 páginas) incluye la planificación (grupo, unidad y tarea), la actividad, la referencia a la IA usada, las capturas de la tabla técnica y de la reflexiva y el enlace a su Bitácora. En la Bitácora, la página «Actividad 1» muestra la imagen, la tarea, las dos tablas completas y las capturas del proceso. Subió el PDF a la plataforma de UNIR y, solo después de enviarlo, marcó «Lo he hecho» en la Nave y pegó el enlace de esa página de su Bitácora.", "detalle": ["Tabla técnica: función de la IA, prompt inicial, iteración, criterio docente, evidencia del proceso y cita de la herramienta.", "Tabla reflexiva: cómo integró la IA, qué cambió en la actividad, qué puso ella y qué aprendió.", "Con el «+» añadió un segundo enlace: el de la imagen publicada.", "Se marca al ENVIAR la actividad, no al empezarla."], "vivo": [{"tipo": "tabla", "titulo": "Tabla técnica (lo que puso Rosa)", "cab": ["Campo", "Rosa"], "filas": [["Función de la IA", "Crear la imagen de partida: la calle mayor de su ciudad en 2050, para describirla y compararla con su barrio."], ["Prompt inicial", "«Ilustración realista de la calle mayor de una ciudad española en 2050, con tranvía, placas solares y gente paseando, sin texto»."], ["Iteración", "Salían coches voladores y rótulos inventados: pidió «tecnología creíble, la calle reconocible y ningún texto»."], ["Criterio docente", "Eligió la versión con más cosas que se pueden predecir con will y be going to (obras, carteles de próximas aperturas)."], ["Evidencia del proceso", "Capturas de las tres versiones y del prompt final, en su Bitácora."], ["Cita de la herramienta", "Imagen generada con Microsoft Designer (12-oct-2026). Prompt y versiones en la Bitácora."]]}, {"tipo": "tabla", "titulo": "Tabla reflexiva", "cab": ["Pregunta", "Rosa"], "filas": [["¿Cómo integró la IA?", "Solo para el material de partida: la tarea, las preguntas y la evaluación son suyas."], ["¿Qué cambió en la actividad?", "Antes describían una foto de hoy; ahora predicen, y eso obliga a usar el futuro con sentido."], ["¿Qué puso ella?", "La elección de la imagen, las preguntas guía y la rúbrica de la exposición."], ["¿Qué aprendió?", "A iterar el prompt con criterios didácticos, no estéticos."]]}]}, "B2": {"titulo": "Marta (Tecnología, 3.º ESO): su videotutorial de Tinkercad", "texto": "Mi videotutorial enseña a diseñar un llavero en Tinkercad y a exportarlo en STL para imprimirlo en 3D. El objetivo didáctico es que mi alumnado de 3.º de ESO sepa agrupar formas, crear huecos y medir en milímetros antes de llegar al taller, para dedicar la clase a imprimir y corregir. Al hacerlo aprendí que el guion lo es todo: la primera grabación duraba nueve minutos y, al escribir antes lo que iba a decir, bajó a cuatro.", "detalle": ["Guion de una página, grabación de pantalla con Screencastify y edición en Clipchamp (cortes y zoom en los botones).", "Subido a YouTube en oculto: se lo enseñó a un compañero para ver si se entendía sin ella delante.", "Aula invertida: lo ven en casa y en clase se imprime.", "La semana siguiente, en clase, le metió las preguntas (el relámpago de Ecos)."], "enlace": "https://youtu.be/ZE_JdQUmepk", "real": {"titulo": "Publicar y compartir un Genially", "autor": "Mr. Cuarter", "donde": "YouTube", "por_que": "Un tutorial corto que explica un procedimiento paso a paso: justo lo que pide el reto."}}, "L2": {"titulo": "Marta (Tecnología, 3.º ESO): tres preguntas dentro de su videotutorial", "texto": "En clase, Marta subió su videotutorial de Tinkercad a Edpuzzle y le metió tres preguntas, cada una justo después de un paso difícil: agrupar formas, crear huecos y medir en milímetros. Le pidió diez preguntas a una IA y se quedó con tres: las que comprueban un paso, no un detalle. Si alguien falla la segunda, sabe exactamente qué tiene que repetir en el taller.", "detalle": ["Importado desde YouTube en Edpuzzle, con 3 preguntas: en el 1:10, el 2:30 y el 3:40.", "Si no hubiera tenido vídeo propio, valía uno ya hecho con preguntas dentro, que le sirviera para su aula.", "El enlace de Edpuzzle va en el reto."], "enlace": "https://edpuzzle.com/media/68ff9e1a400997c66a1f3eea", "vivo": [{"tipo": "linea", "titulo": "Su vídeo en Edpuzzle: 4:00 y tres preguntas, justo después de cada paso difícil", "dura": "4:00", "marcas": [{"t": "1:10", "paso": "Agrupar formas", "q": "Para unir el aro y el cuerpo del llavero en una sola pieza, ¿qué botón usas?", "opciones": ["Agrupar", "Alinear", "Duplicar"], "bien": 0, "explica": "Agrupar une las formas en una sola pieza que se mueve y se exporta junta."}, {"t": "2:30", "paso": "Crear huecos", "q": "¿Cómo haces el agujero para la anilla?", "opciones": ["Pongo un cilindro en modo «Hueco» y agrupo", "Borro un trozo con la goma", "Bajo la opacidad del aro"], "bien": 0, "explica": "Una forma en modo «Hueco» agrupada con la pieza la agujerea."}, {"t": "3:40", "paso": "Medir en milímetros", "q": "El llavero tiene que medir 5 cm de largo. ¿Qué escribes en Tinkercad?", "opciones": ["5", "50", "500"], "bien": 1, "explica": "Tinkercad mide en milímetros: 5 cm son 50 mm."}]}], "real": {"titulo": "Taxonomía de Bloom: qué es y ejemplos de aplicación", "donde": "Edpuzzle", "por_que": "Un vídeo con preguntas insertadas que comprueban la comprensión mientras se ve."}}, "L3": {"titulo": "Irene (Inglés, 5.º de Primaria) diseña dos senderos hacia el mismo objetivo", "texto": "Irene eligió un objetivo: describir su rutina diaria en presente simple. Diseñó dos actividades distintas para llegar a él. «Hazlo»: ordenar viñetas de un día y grabar un audio contándolas. «Léelo»: leer un cómic corto y completar una tabla de horas y acciones. Las dos terminan en la misma tarea: escribir cinco frases sobre su propio día. Lo hizo en clase en una hoja, le hizo una foto y la pegó en el reto.", "detalle": ["Criterio: dos actividades distintas de verdad, no la misma con otro nombre.", "En el reto principal lo convierte en un itinerario de Genially, con refuerzo y ampliación."]}, "B3": {"titulo": "Irene lleva sus dos senderos a un itinerario de Genially, con refuerzo y ampliación", "texto": "Irene llevó a Genially los dos senderos de su relámpago (describir su rutina diaria en presente simple). La portada presenta el objetivo y dos puertas: «Hazlo» y «Léelo». Antes de la tarea final añadió una actividad de refuerzo —ordenar frases con las horas, para quien se atasca— y una de ampliación —comparar su rutina con la de un niño de otro país, para quien va por delante—, cada una con su botón. Lo publicó en abierto, lo comprobó en una ventana de incógnito y pegó el enlace en el reto y en su Bitácora.", "detalle": ["Refuerzo: para quien lo necesita, antes de la tarea final.", "Ampliación: para quien va por delante.", "Es el esqueleto del paisaje de la Actividad 2; la matriz 8×6 se hace dentro de la Actividad."], "enlace": "https://view.genially.com/673a886db3cebc087dcc971a", "real": {"titulo": "(Math) Series niveladas", "donde": "Genially", "por_que": "Varias actividades para un mismo objetivo, y cada estudiante escoge su camino."}}, "X2": {"titulo": "Patricia entrega su paisaje de aprendizaje y lo marca en la Nave", "texto": "Patricia, maestra de 3.º de Primaria, amplió la matriz de su unidad «Las plantas» a ocho actividades y las llevó a un paisaje: una imagen interactiva en Genially (no una presentación) con un huerto ilustrado en el que cada planta abre una actividad y se entra por la que se quiera, sin orden: el color solo dice si es obligatoria, optativa o voluntaria. Su PDF (11 páginas, dentro del límite para ocho actividades) recoge la contextualización, la matriz y la ficha completa de cada actividad. En la Bitácora añadió la página «Actividad 2» con la matriz, el paisaje incrustado y un párrafo sobre cómo ese diseño atiende a la diversidad. Subió el PDF a la plataforma de UNIR y, al enviarlo, marcó «Lo he hecho» en la Nave con el enlace del paisaje y, con el «+», el de su Bitácora.", "detalle": ["PDF (80 %): contextualización, matriz 8×6 y ficha de cada actividad (objetivo, tarea, recursos citados, evaluación, tiempo y tipo).", "ePortfolio (20 %): evidencias de la matriz y del paisaje, más la justificación del diseño y de la atención a la diversidad.", "Se marca al ENVIAR la actividad, no al empezarla."], "imagen": "X2_paisaje.jpg", "imagen_alt": "El paisaje de aprendizaje de Patricia: un huerto ilustrado con ocho plantas marcadas por colores, sin números ni orden, y la ficha de la zanahoria abierta."}, "L4": {"titulo": "Álvaro publica en LinkedIn su primer videoquiz, sin esperar a pulirlo", "texto": "Álvaro, profesor de Educación Física de 1.º de Bachillerato, publicó en LinkedIn, en abierto, una captura de su primer videoquiz con dos líneas: «Esta semana he convertido la explicación del salto de altura en un vídeo con preguntas para verlo antes de clase. No es perfecto, pero mi grupo ya lo está usando. #mutecdstargate». Tardó cinco minutos. Abrió la publicación, copió su enlace directo y lo pegó en el reto. Esa misma publicación le sirve después como evidencia en otros retos."}, "B4": {"titulo": "Daniel (Física y Química, 4.º ESO) monta su Classroom con tres recursos que ya existen", "texto": "Mi contenido llega al móvil a través de la app de Classroom: cada tarea y cada anuncio avisan con una notificación, y elijo recursos que se ven bien en pantalla pequeña (vídeos cortos y una simulación que funciona en el navegador del móvil). Las instrucciones caben en tres líneas, no en un PDF. La conversación la mantengo viva así: cada lunes publico en el tablón una pregunta de la semana, respondo a los comentarios de clase en menos de 24 horas y en cada práctica dejo un comentario privado a cada estudiante. Cuando una duda se repite, la respondo en el tablón para todos.", "detalle": ["Aula «Física y Química 4.º B» con una tarea publicada: «Práctica: densidad de sólidos irregulares», con fecha y rúbrica.", "Tablón abierto a comentarios y un anuncio de bienvenida.", "Tres recursos ajenos, cada uno con dos líneas de por qué ese y su fuente: la simulación «Densidad» de PhET (Universidad de Colorado, CC BY 4.0), un vídeo divulgativo de YouTube sobre el principio de Arquímedes (canal citado) y un juego de Educaplay de otro docente sobre unidades (autor citado).", "Google Doc con permiso de lectura y dos capturas (el tablón y la tarea): su enlace va en el reto."], "imagen": "B4.jpg", "imagen_alt": "El tablón de Classroom «Física y Química 4.º B» con la pregunta de la semana y una tarea con tres recursos citados."}, "L5": {"titulo": "Laura (Inglés, 2.º ESO) hace una rúbrica de autoevaluación y un formulario para recogerla", "texto": "Laura eligió un objetivo que ya trabaja: «Presentar oralmente su ciudad durante dos minutos». Hizo una rúbrica de autoevaluación con 4 criterios (contenido, vocabulario, fluidez y pronunciación) y 4 niveles (Inicial, En proceso, Conseguido y Destacado). En cada casilla escribió lo que se ve o se oye, no un adjetivo: en vez de «buen vocabulario», «usa 8 o más palabras de la unidad sin repetir». Después la pasó a un Google Forms, una pregunta por criterio con los cuatro niveles como opciones, para que cada estudiante se autoevalúe al terminar su exposición. Pegó en el reto el enlace del formulario y una captura de la rúbrica.", "detalle": ["Contenido · Destacado: nombra 4 o más lugares y da un dato de cada uno. Inicial: nombra 1 lugar, sin datos.", "Fluidez · Destacado: habla dos minutos con 2 pausas largas como máximo. Inicial: lee casi todo del papel.", "Sin adjetivos sueltos («bien», «adecuado»): si no se puede observar, no se puede medir.", "Opción que se ve en clase: CoRubrics, que convierte la rúbrica en el formulario solo."], "vivo": [{"tipo": "tabla", "titulo": "Rúbrica · Presentar oralmente su ciudad durante dos minutos (Inglés, 2.º ESO)", "cab": ["Criterio", "Inicial", "En proceso", "Conseguido", "Destacado"], "filas": [["Contenido", "Nombra 1 lugar, sin datos", "Nombra 2 lugares y da un dato de uno", "Nombra 3 lugares y da un dato de cada uno", "Nombra 4 o más lugares y da un dato de cada uno"], ["Vocabulario", "Usa menos de 4 palabras de la unidad", "Usa de 4 a 7 palabras de la unidad", "Usa 8 o más palabras de la unidad sin repetir", "Usa 8 o más y 2 expresiones nuevas de la unidad"], ["Fluidez", "Lee casi todo del papel", "No llega a 2 minutos o para muchas veces", "Habla 2 minutos con 3 o 4 pausas largas", "Habla 2 minutos con 2 pausas largas como máximo"], ["Pronunciación", "No se entiende más de la mitad", "Se entiende con esfuerzo en varias frases", "Se entiende todo, con algún error", "Se entiende todo y cuida la entonación de las preguntas"]], "nota": "Cada casilla dice lo que se ve o se oye, no un adjetivo: «usa 8 o más palabras», no «buen vocabulario»."}]}, "B5": {"titulo": "Laura monta en Google Sites el centro de recursos de Inglés de 2.º ESO", "texto": "Laura creó en Google Sites «English Hub · 2.º ESO» con un menú de cinco páginas: Inicio, Unidad 1, Unidad 2, Unidad 3 y «Cómo se evalúa». Cada unidad tiene sus recursos (un vídeo con preguntas, un juego de Wordwall, una ficha de vocabulario), cada uno con una línea que dice para qué sirve. En «Cómo se evalúa» incrustó la rúbrica de la exposición oral que hizo en el reto anterior. Comprobó el enlace en incógnito y lo pegó en el reto. En su Bitácora añadió la entrada «Centro de recursos»: evidencia (el enlace), contexto (grupo y uso) y reflexión (qué cambia al tenerlo todo en un sitio). Esa misma semana cerró allí su página de la Actividad 1.", "detalle": ["Web no es aula virtual: aquí no se entregan tareas; el alumnado encuentra los recursos sin pedirlos.", "Organizada con criterio: por unidad (también valdría por tipo de recurso).", "La rúbrica, a la vista en su propia página, no escondida tras un enlace."], "imagen": "B5.jpg", "imagen_alt": "El sitio «English Hub · 2.º ESO» con su menú de cinco páginas y la rúbrica incrustada en «Cómo se evalúa»."}, "L6": {"titulo": "Sergio (Matemáticas, 1.º ESO) adapta el Uno para practicar fracciones", "texto": "Sergio cogió el Uno de toda la vida y le cambió una regla: sobre cada carta pegó una fracción, y solo se puede echar una carta si es equivalente a la de la mesa (1/2 sobre 2/4) o si es del mismo color. Las cartas de «roba dos» obligan a simplificar en voz alta la fracción que te toca. Lo probó en clase con un grupo, hizo una foto de la mesa con las cartas y la pegó en el reto.", "detalle": ["No inventa un juego: adapta uno que todos conocen.", "La regla nueva es la que enseña: sin fracciones equivalentes, no se juega.", "Vale igual uno digital: la URL de un Kahoot, un Wordwall o un Genially que ya exista, y lo que le cambias."]}, "B6": {"titulo": "Carlos (Química, 1.º Bachillerato): escape de formulación en tres fases", "texto": "Mi juego cubre este objetivo: nombrar y formular compuestos inorgánicos binarios y ternarios según la IUPAC. Es un escape en Genially con tres fases, y cada una sube la dificultad: en la primera se reconocen óxidos e hidruros; en la segunda hay que nombrar sales binarias; en la tercera, formular oxoácidos a partir de su nombre. Cada fase da un dígito del candado final, así que no se avanza sin acertar. Lo evalúo con un Google Forms al final, donde cada equipo escribe el código y cuántos intentos le costó cada fase, y con una lista de cotejo mientras juegan: así veo en qué fase se atascan y qué tengo que repasar.", "detalle": ["Hecho en Genially con una plantilla de escape: portada, tres salas y candado final.", "Cada mecánica sirve a un aprendizaje: sin nombrar bien el compuesto, la puerta no se abre.", "Enlace público del Genially en el reto; la reflexión, en su Bitácora."], "imagen": "B6.jpg", "imagen_alt": "La fase 3 del escape de formulación de Carlos: un laboratorio con un candado de tres dígitos y la consigna «Formula el ácido sulfúrico»."}, "L7": {"titulo": "Rocío (5.º de Primaria) crea la insignia «Guardianes de la biblioteca»", "texto": "Se llama «Guardianes de la biblioteca». Reconoce al equipo que cada viernes deja la biblioteca de aula ordenada, con los libros revisados y las fichas de préstamo al día. En nuestra historia de clase, esos libros son el archivo de todas las aventuras que hemos leído: si se pierden o se rompen, el lunes nadie puede seguir la suya. No premia obedecer: recuerda que cuidar lo que es de todos es cuidar a los compañeros.", "detalle": ["Diseñada con la IA de Canva a partir de una descripción: escudo azul con un libro abierto y una llave.", "Compartida con el enlace de solo lectura de Canva."], "imagen": "A7.jpg", "imagen_alt": "La insignia «Guardianes de la biblioteca»: un escudo azul y dorado con un libro abierto y una llave."}, "B7": {"titulo": "Ana (FP de Cuidados Auxiliares de Enfermería) convierte el registro diario en un turno de guardia", "texto": "Mi microgamificación refuerza una conducta concreta: rellenar cada día, completa y sin errores, la hoja de registro de las prácticas. Nadie juega: la tarea es la de siempre. La envuelve una historia: mi grupo es el equipo de guardia del «Hospital Aurora» y cada registro bien hecho es un paciente atendido a tiempo. En un tablero de Genially cada equipo tiene la barra de progreso de su turno, y con cinco días seguidos sin errores gana la insignia «Turno impecable». Lo hago así porque en su trabajo real un registro incompleto tiene consecuencias, y la historia les ayuda a verlo antes de salir a las prácticas.", "detalle": ["Tablero en Genially: una barra por equipo que avanza con cada registro que valida la profesora.", "Insignia «Turno impecable» al quinto día seguido sin errores.", "No es ABJ: no hay un juego que jugar, solo elementos de juego (historia, progreso e insignia) sobre una tarea real."], "imagen": "B7.jpg", "imagen_alt": "El tablero «Hospital Aurora · Equipo de guardia» con la barra de cada equipo y la insignia «Turno impecable»."}, "L8": {"titulo": "Víctor mete en una diapositiva el QR de su juego sobre la orquesta", "texto": "Víctor, profesor de Música de 2.º de ESO, abrió en Chrome el enlace público de su juego de Wordwall sobre las familias de instrumentos y generó el QR con el botón derecho → «Crear código QR para esta página». Lo pegó en una diapositiva de Google Slides titulada «Escanea y juega: la orquesta», lo escaneó con su móvil para comprobar que abría el juego y, con la pantalla partida, hizo una captura con la diapositiva a la izquierda y el juego abierto a la derecha, con su dirección visible. La pegó en el reto. Ocho minutos.", "imagen": "L8.jpg", "imagen_alt": "A la izquierda, la diapositiva «Escanea y juega: la orquesta» con su QR; a la derecha, el juego de Wordwall abierto con su dirección."}, "B8": {"titulo": "Lucía publica su Bitácora completa antes del examen", "texto": "Lucía, la profesora de Biología y Geología de 3.º de ESO que abrió su Bitácora en la semana 2, la cerró antes del examen: la página de la Actividad 1, la de la Actividad 2 con su paisaje incrustado, sus experiencias del portfolio con las tres hazañas —el videotutorial, la microgamificación y, a su elección, su juego digital— y la lámina con el QR de su relámpago. Lo abrió todo en una ventana de incógnito y pegó el enlace único en el reto.", "detalle": ["Cada página sigue el mismo patrón: evidencia, contexto, reflexión y autoevaluación.", "Un solo enlace, el de la Bitácora, que lleva a todo lo demás."]}, "XS": {"titulo": "Isabel monta su plataforma «EXPLORA» en 90 minutos", "texto": "Isabel, maestra de 6.º de Primaria, recibió un caso: una plataforma para preparar una salida al entorno natural. Minutos 0-15: un Google Sites con portada, el logo hecho en Canva con la palabra clave que pedía el caso, «EXPLORA», y cinco líneas que explican el enfoque. Minutos 15-40: Módulo 1 (antes de la salida), con su videoquiz reutilizado del tema 2 y un cuestionario de autoevaluación de tres preguntas creado en el momento. Minutos 40-65: Módulo 2 (durante la salida), con un juego de Wordwall creado en directo y su QR dentro de una lámina. Minutos 65-78: justificación de diez líneas según el ABP. Minutos 78-90: todos los enlaces abiertos en incógnito, capturas y repaso de ortografía. Al terminar, pegó el enlace público y subió las capturas.", "detalle": ["¿El logo lleva la palabra clave?", "¿Se abre todo en una ventana de incógnito?", "¿Hay dos módulos y tres productos?", "¿La justificación cabe en diez líneas?", "¿Hay capturas y se ha repasado la ortografía?"], "imagen": "XS.jpg", "imagen_alt": "La portada de «EXPLORA» en Google Sites: el logo, cinco líneas de presentación y los botones «Módulo 1 · Antes» y «Módulo 2 · Durante»."}}, "retos": {"A0": ["A0", "Reto «Preséntate a tu tripulación» (vídeo de 60 s)", ["E1_nebula"], 100, 1], "L0": ["L0", "Reto relámpago «La hoja de ruta» (tu programación didáctica)", [], 60, 1], "L1": ["L1", "Reto relámpago «Del boceto a la forja» (recupera a Bran)", ["P1_bran", "R1_la-chispa"], 100, 1], "B1": ["B1", "Reto principal «La Bitácora en marcha» (tu ePortfolio)", ["R0_bitacora-en-marcha"], 250, 1], "X1": ["X1", "Actividad 1 entregada (imagen con IA)", ["H2_primera-forja", "E2_capitan"], 500, 1], "B2": ["B2", "Reto principal «El eco que enseña» (tu videotutorial)", ["R2_el-eco-que-ensena"], 250, 2], "L2": ["L2", "Reto relámpago «El vídeo que pregunta» (recupera a Tomás)", ["P2_tomas"], 100, 2], "L3": ["L3", "Reto relámpago «Dos senderos» (recupera a Sylla)", ["P3_sylla"], 100, 3], "B3": ["B3", "Reto principal «El itinerario» (refuerzo y ampliación en Genially)", ["R3_la-matriz"], 250, 3], "X2": ["X2", "Actividad 2 entregada (paisaje de aprendizaje)", ["H3_cartografo"], 500, 3], "L4": ["L4", "Reto relámpago «Abre el canal» (recupera a Amara)", ["P4_amara"], 100, 4], "B4": ["B4", "Reto principal «El entorno de aula» (Classroom o Sites)", ["R4_entorno-de-aula"], 250, 4], "L5": ["L5", "Reto relámpago «Mide con método» (recupera a Vera)", ["P5_vera"], 100, 5], "B5": ["B5", "Reto principal «Tu centro de recursos» (web abierta + rúbrica)", ["R5_bitacora-medida"], 250, 5], "L6": ["L6", "Reto relámpago «Encuentra el juego» (recupera a Joran)", ["P6_joran"], 100, 6], "B6": ["B6", "Reto principal «El juego» (juego digital)", ["R6_el-juego"], 250, 6], "L7": ["L7", "Reto relámpago «Un porqué» (recupera a Mara)", ["P7_mara"], 100, 7], "B7": ["B7", "Reto principal «La microgamificación»", ["R7_microgamificacion"], 250, 7], "L8": ["L8", "Reto relámpago «El QR» (recupera a Noa)", ["P8_noa"], 100, 8], "B8": ["B8", "Reto principal «El último umbral» (tu Bitácora publicada)", ["R8_ultimo-umbral"], 250, 8], "XS": ["XS", "Reto «El simulacro del examen» (90 minutos de reloj)", ["H7_listo-para-la-batalla"], 300, 8]}, "consignas": {"A0": "Graba un vídeo de MÁXIMO 60 segundos presentándote al resto de la tripulación y publícalo en la sección «Preséntate» del padlet de la clase (título = tu alias; primera línea = «Comandante: tu profe»). No hace falta guion de cine — si te da apuro, responde a tres o cuatro de estas: ¿quién eres y a qué te dedicas? ¿desde dónde te conectas? ¿por qué educación? ¿una herramienta que ames y una que sufras? ¿un dato curioso que nadie adivinaría? Grábalo del tirón con el móvil: natural gana a perfecto. Después copia el enlace de TU publicación (los tres puntos ⋮ → «Copiar el enlace a la publicación») y pégalo aquí. Sirve para ponernos cara desde el primer día — y NEBULA te da su insignia: lo que se comparte no se apaga.", "L0": "Quince minutos, en clase. Tu Comandante enseña en directo una herramienta para crear programaciones didácticas; con ella, haz la programación de una unidad de tu aula: nivel, área, objetivos, contenidos, actividades y evaluación. No tiene que estar terminada: tiene que existir. Pega aquí el enlace o una captura. Es tu punto de partida: las dos Actividades parten de una unidad real de tu aula. Si no pudiste venir, hazla esta semana con la herramienta que prefieras.", "L1": "Quince minutos, en clase. Trae una idea a medias —un boceto en papel, unas notas, una foto— y hazla realidad con una IA: una imagen, una infografía o el logo de tu palabra clave. Escribe una instrucción con contexto educativo, tipo de imagen y finalidad, y haz al menos una iteración. Sube el antes y el después (enlace o captura). Es el núcleo de la Actividad 1, que parte justo de una imagen generada con IA.", "B1": "(1) Crea tu Bitácora (tu ePortfolio) en la plataforma que quieras —Google Sites, Genially, Wix, un blog…— o parte de la plantilla oficial en Genially. (2) Publica su primera experiencia: los recursos multimedia que has creado con IA —el del relámpago y uno más: un texto, un audio o una infografía—, con su evidencia, su contexto, tu reflexión y tu autoevaluación. (3) Comprueba que el enlace es público (ábrelo en una ventana de incógnito) y pégalo aquí y en tu BIO de la Nave. Es la experiencia del portfolio de este tema y la página donde irá la Actividad 1 (el 20 % de su nota).", "X1": "La Actividad 1 entregada donde te la pide tu profesor. Pulsa «Lo he hecho» cuando la hayas ENVIADO, no cuando la empieces, y pega el enlace o los enlaces que compartiste en tu actividad (es obligatorio; el «+» añade un segundo).", "B2": "Graba un videotutorial corto —de dos a cuatro minutos— sobre un procedimiento de tu área, como si se lo contaras a alguien que hoy no ha podido venir: un guion breve, la grabación (de pantalla o con el móvil) y una edición sencilla (Canva, CapCut o Clipchamp). Puedes apoyarte en una IA para el guion, la voz o los subtítulos. Súbelo donde quieras (YouTube en oculto, Drive con permiso de lectura…) y pega su enlace. Criterio: que se entienda sin ti delante. Llévalo a tu Bitácora: es la hazaña del videotutorial, y la semana que viene, en clase, le meterás las preguntas.", "L2": "Quince minutos, en clase. Coge un vídeo —tu videotutorial o uno ya hecho de tu área— y métele dentro dos o tres preguntas con Edpuzzle o H5P, justo después de cada paso difícil. Pídele las preguntas a una IA y quédate con las que de verdad comprueban que se ha entendido. ¿No te da tiempo? Encuentra un vídeo que ya tenga preguntas dentro y que te sirva para tu aula. Pega el enlace.", "L3": "Quince minutos, en clase. Elige un objetivo de aprendizaje y diseña dos actividades distintas que lo trabajen: dos senderos para llegar a la misma cima (por ejemplo, uno haciendo y otro leyendo). Que sean de verdad distintas, no la misma con otro nombre. En papel o en un documento: pega el enlace o la captura. Es la bifurcación de tu itinerario.", "B3": "Completa en Genially el itinerario de tus dos senderos: un punto de partida, la bifurcación del relámpago y, además, una actividad de refuerzo para quien lo necesite y una de ampliación para quien va por delante. Cada estudiante tiene que poder elegir su camino. Pega el enlace (público) y llévalo a tu Bitácora. Es la experiencia de Genially del portfolio y el esqueleto del paisaje de la Actividad 2 (la matriz 8×6 se hace dentro de la Actividad).", "X2": "La Actividad 2 entregada donde te la pide tu profesor. Igual: al ENVIARLA, y pega el enlace o los enlaces que compartiste en tu actividad (es obligatorio; el «+» añade un segundo).", "L4": "Diez minutos, en clase. Publica en tus redes (X, LinkedIn, Instagram…) algo que hayas creado en el curso —una imagen, tu vídeo, tu itinerario— con el hashtag #mutecdstargate, en abierto. Pega el enlace de la publicación. Criterio: a tiempo por encima de perfecto — se publica hoy, se pule mañana.", "B4": "Monta tu aula en Google Classroom (puede ser cerrada) o en Google Sites: publica una tarea y tres materiales organizados para tu alumnado. Comparte un documento con dos capturas de tu aula —o su enlace, si es abierta— y pégalo aquí. Es la experiencia de Sites o Classroom del portfolio.", "L5": "Quince minutos, en clase. Crea una rúbrica de autoevaluación para tu alumnado —tres o cuatro criterios, con niveles descritos de forma observable— y un formulario para recoger lo que respondan. En clase verás CoRubrics como una opción posible (convierte la rúbrica en un formulario), pero vale cualquier formulario. Pega el enlace o las capturas de las dos piezas. Es la experiencia de Forms del portfolio.", "B5": "Monta el centro de recursos de tu alumnado en una web abierta, con una herramienta distinta a la del reto anterior (Google Sites, Genially…): tres recursos tuyos organizados con criterio y tu rúbrica a la vista. Tiene que abrirse sin tu cuenta: compruébalo en una ventana de incógnito. Pega el enlace y enlázalo desde tu Bitácora. Practicas otra plataforma, esta vez abierta, como la que montarás en el examen.", "L6": "Quince minutos, en clase. Busca un juego que ya exista —digital o de mesa— y adáptalo a un objetivo tuyo: cambia una regla, una carta o una casilla para que enseñe. Sube una foto, una captura o la URL. Es la idea de partida de tu juego digital.", "B6": "Crea un juego digital (Genially, Wordwall, Educaplay…) con niveles o varias formas de jugarlo, al servicio de un objetivo concreto, y mételo en tu paisaje de aprendizaje. Pega el enlace y llévalo a tu Bitácora. Es la experiencia de juego digital del portfolio.", "L7": "Quince minutos, en clase. Diseña con IA una insignia o una carta de recompensa para una tarea de tu aula. Pega el enlace o la captura. Es la experiencia de recursos de gamificación del portfolio… y la recompensa que corona el tablero del examen.", "B7": "Gamifica una tarea real de tu aula: una narrativa corta que la envuelva, una secuencia de tres retos y la recompensa del relámpago. Pega el enlace y llévalo a tu Bitácora. Es una de las hazañas obligatorias de la Bitácora y el esqueleto del examen: tablero de retos y recompensa.", "L8": "Diez minutos, en clase. Enlaza una actividad o un recurso tuyo a un código QR y compruébalo con el móvil. Sube la captura del QR y de adónde lleva. En el examen te pueden pedir un QR creado en el momento: hecho una vez, son diez minutos.", "B8": "Publica tu Bitácora completa: las páginas de las dos Actividades, tus experiencias del portfolio —con las tres hazañas: el videotutorial, la microgamificación y una a tu elección— y tu QR. Revisa que todo se abre sin tu cuenta y pega el enlace único. Es el ePortfolio que se evalúa, listo antes del examen.", "XS": "El ensayo general, con el reloj de verdad: 90 minutos para resolver un caso como el del examen. Se hace en la clase de repaso (semana 15). Se te dará un planteamiento y tendrás que montar, EN ESE RATO, una plataforma digital (web o Genially) con su portada, su logo con la palabra clave, dos módulos y tres productos digitales —algunos puedes reutilizarlos de los que ya has hecho en el viaje: para eso está tu Arsenal—. Al terminar, pega aquí el enlace público y sube tus capturas. No lleva nota: lleva una lista de comprobación que repasas tú mismo delante de todos (¿el logo lleva la palabra?, ¿se abre en incógnito?, ¿hay dos módulos?, ¿tres productos?, ¿la justificación cabe en diez líneas?). Nadie sabe lo que son noventa minutos hasta que los vive."}, "planetas": [["p1_forge", "Fôrge", "T1 · Contenido multimedia"], ["p2_ecos", "Ecos", "T2 · El vídeo"], ["p3_sendara", "Sendara", "T3 · Interactivos"], ["p4_reliae", "Reliae", "T4 · M-learning"], ["p5_umbral", "Umbral", "T5 · Evaluación"], ["p6_ludo", "Ludo", "T6 · ABJ"], ["p7_vinculo", "Vínculo", "T7 · Gamificación"], ["p8_liminar", "Liminar", "T8 · RA/RV"]], "reflexion": []};</script>
