<script>window.SG_EJ={"ejemplos": {"A0": {"titulo": "Carmen se presenta en 55 segundos, grabada con el móvil", "texto": "Carmen, maestra de 4.º de Primaria en un colegio de Zaragoza, se grabó con el móvil en su casa, del tirón y sin guion: «Soy Carmen, llevo doce años con niños de 9 y 10 años y me conecto desde Zaragoza. Me metí en educación por mi maestra de 5.º. Me encanta Genially y sufro con las hojas de cálculo. Un dato curioso: toco la gaita». Duró 55 segundos. Lo publicó en la sección «Preséntate» del padlet de la clase, con su alias (Capella) como título y «Capitán:» más el nombre de su profe en la primera línea. Después copió el enlace de su publicación (⋮ → «Copiar el enlace a la publicación») y lo pegó en el reto."}, "A1": {"titulo": "Javier (FP) saca del cajón un banco de prácticas a medias", "texto": "Tengo a medias un banco de prácticas de montaje de ordenadores para 1.º del ciclo de Sistemas Microinformáticos y Redes. Lo empecé en Genially: hay seis fichas hechas (placa base, procesador, RAM, fuente, disco y refrigeración) y faltan las de periféricos y la autoevaluación final. Se quedó ahí en febrero, cuando me di cuenta de que las fotos de los componentes eran de internet y no sabía si podía usarlas. Me frenó eso y el perfeccionismo: quería hacer yo todas las fotos en el taller y nunca encontraba el momento. Lo comparto tal cual, con sus huecos.", "detalle": ["Javier, profesor de FP de Grado Medio, lo escribe directamente en la caja del reto: no se corrige ni se puntúa.", "Opcional: el enlace al Genially con permiso de lectura, para que la tripulación lo vea."]}, "B1": {"titulo": "Lucía abre su Bitácora en Google Sites y publica su presentación", "texto": "Lucía, profesora de Biología y Geología de 3.º de ESO en un instituto de Murcia, creó su Bitácora en Google Sites y la llamó «Bitácora de Lucía · MUTECD». La personalizó con el verde de su departamento, otra tipografía y una foto suya en el laboratorio. Dejó el menú preparado con cinco páginas vacías (Actividad 1, Actividad 2, Videotutorial, Microgamificación y Reto libre) y publicó la primera entrada, «Quién soy»: diez líneas sobre su trayectoria, sus grupos y lo que espera del máster («aprender a crear recursos que mi alumnado use también desde el móvil»). Pulsó «Publicar», abrió el enlace en una ventana de incógnito para comprobar que se veía sin su cuenta y lo pegó en el reto y en su BIO de la Nave.", "detalle": ["Alternativa rápida: duplicar la plantilla oficial de Genially y cambiar colores, foto y textos.", "No hace falta que esté llena: basta con la portada y la primera entrada.", "Si la cuenta del centro no deja publicar en abierto, mejor crearla con una cuenta personal.", "Comprobación clave: el enlace se abre en incógnito sin pedir permiso."], "imagen": "B1.jpg", "imagen_alt": "La portada de la Bitácora de Lucía en Google Sites: cabecera verde, menú de cinco páginas y la página «Quién soy» con su foto."}, "L1": {"titulo": "Pilar crea una infografía del aparato circulatorio y el logo «PULSO»", "texto": "Pilar, maestra de 6.º de Primaria, pidió a Microsoft Designer una infografía del recorrido de la sangre con un prompt que dice contexto, tipo de imagen y finalidad. La primera versión traía etiquetas inventadas en inglés, así que iteró: «solo seis etiquetas, en español y con letra grande». Eligió la segunda y lo justificó en dos líneas: «Se lee desde el fondo del aula y distingue por color la sangre con y sin oxígeno, que es justo lo que evalúo». Después hizo en Canva un logo circular con un corazón y la palabra «PULSO» dentro. Puso las dos imágenes en la portada de su Bitácora y pegó una captura en el padlet.", "detalle": ["Prompt: «Eres ilustrador de materiales escolares. Para una clase de 6.º de Primaria sobre el aparato circulatorio, crea una infografía vertical del recorrido de la sangre (corazón, pulmones y resto del cuerpo) con flechas rojas y azules. Finalidad: que el alumnado explique el recorrido con sus palabras».", "Iteración: «Solo seis etiquetas, en español, letra grande y fondo blanco».", "Criterio docente, en dos líneas: por qué esa versión y no la otra.", "Logo: hecho en Canva, con la palabra clave «PULSO» bien visible."], "imagen": "L1.jpg", "imagen_alt": "Las dos versiones de la infografía del aparato circulatorio (la primera con etiquetas en inglés, la segunda elegida) y el logo circular «PULSO»."}, "X1": {"titulo": "Rosa entrega su Actividad 1 y la marca en la Nave al enviarla", "texto": "Rosa, profesora de Inglés de 1.º de Bachillerato, diseñó una actividad de expresión oral a partir de una imagen creada con IA: una calle de su ciudad en 2050 que el alumnado describe y compara con su barrio usando will y be going to. Su PDF (4 páginas) incluye la planificación (grupo, unidad y tarea), la actividad, la referencia a la IA usada, las capturas de la tabla técnica y de la reflexiva y el enlace a su Bitácora. En la Bitácora, la página «Actividad 1» muestra la imagen, la tarea, las dos tablas completas y las capturas del proceso. Subió el PDF a la plataforma de UNIR y, solo después de enviarlo, marcó «Lo he hecho» en la Nave y pegó el enlace de esa página de su Bitácora.", "detalle": ["Tabla técnica: función de la IA, prompt inicial, iteración, criterio docente, evidencia del proceso y cita de la herramienta.", "Tabla reflexiva: cómo integró la IA, qué cambió en la actividad, qué puso ella y qué aprendió.", "Con el «+» añadió un segundo enlace: el de la imagen publicada.", "Se marca al ENVIAR la actividad, no al empezarla."], "vivo": [{"tipo": "tabla", "titulo": "Tabla técnica (lo que puso Rosa)", "cab": ["Campo", "Rosa"], "filas": [["Función de la IA", "Crear la imagen de partida: la calle mayor de su ciudad en 2050, para describirla y compararla con su barrio."], ["Prompt inicial", "«Ilustración realista de la calle mayor de una ciudad española en 2050, con tranvía, placas solares y gente paseando, sin texto»."], ["Iteración", "Salían coches voladores y rótulos inventados: pidió «tecnología creíble, la calle reconocible y ningún texto»."], ["Criterio docente", "Eligió la versión con más cosas que se pueden predecir con will y be going to (obras, carteles de próximas aperturas)."], ["Evidencia del proceso", "Capturas de las tres versiones y del prompt final, en su Bitácora."], ["Cita de la herramienta", "Imagen generada con Microsoft Designer (12-oct-2026). Prompt y versiones en la Bitácora."]]}, {"tipo": "tabla", "titulo": "Tabla reflexiva", "cab": ["Pregunta", "Rosa"], "filas": [["¿Cómo integró la IA?", "Solo para el material de partida: la tarea, las preguntas y la evaluación son suyas."], ["¿Qué cambió en la actividad?", "Antes describían una foto de hoy; ahora predicen, y eso obliga a usar el futuro con sentido."], ["¿Qué puso ella?", "La elección de la imagen, las preguntas guía y la rúbrica de la exposición."], ["¿Qué aprendió?", "A iterar el prompt con criterios didácticos, no estéticos."]]}]}, "A2": {"titulo": "Un clip de 50 segundos para quien faltó a clase", "texto": "Nuria, profesora de Lengua de 1.º de ESO, grabó con el móvil 50 segundos sobre cómo encontrar el sujeto de una oración: escribe una frase en la pizarra, pone el verbo en plural y señala qué grupo de palabras tiene que cambiar con él. Nada más. Lo subió a YouTube en oculto, se lo enseñó a su hija para ver si se entendía sin ella delante y pegó el enlace en el reto.", "enlace": "https://youtu.be/ZE_JdQUmepk", "real": {"titulo": "Publicar y compartir un Genially", "autor": "Mr. Cuarter", "donde": "YouTube", "por_que": "Un tutorial corto que explica un procedimiento paso a paso: justo lo que pide el reto."}}, "B2": {"titulo": "Marta (Tecnología, 3.º ESO): videotutorial de Tinkercad con tres preguntas", "texto": "Mi videotutorial enseña a diseñar un llavero en Tinkercad y a exportarlo en STL para imprimirlo en 3D. El objetivo didáctico es que mi alumnado de 3.º de ESO sepa agrupar formas, crear huecos y medir en milímetros antes de llegar al taller, para dedicar la clase a imprimir y corregir. Las tres preguntas están justo después de cada paso difícil. Al hacerlo aprendí que el guion lo es todo: la primera grabación duraba nueve minutos y, al escribir antes lo que iba a decir, bajó a cuatro. También aprendí que una buena pregunta comprueba un paso, no un detalle.", "detalle": ["Guion de una página, grabación de pantalla con Screencastify y edición en Clipchamp (cortes y zoom en los botones).", "Subido a YouTube en oculto e importado en Edpuzzle con 3 preguntas: en el 1:10, el 2:30 y el 3:40.", "Aula invertida: lo ven en casa y en clase se imprime.", "El enlace de Edpuzzle va en el reto; la reflexión, en la caja y en su Bitácora."], "enlace": "https://edpuzzle.com/media/68ff9e1a400997c66a1f3eea", "vivo": [{"tipo": "linea", "titulo": "Su vídeo en Edpuzzle: 4:00 y tres preguntas, justo después de cada paso difícil", "dura": "4:00", "marcas": [{"t": "1:10", "paso": "Agrupar formas", "q": "Para unir el aro y el cuerpo del llavero en una sola pieza, ¿qué botón usas?", "opciones": ["Agrupar", "Alinear", "Duplicar"], "bien": 0, "explica": "Agrupar une las formas en una sola pieza que se mueve y se exporta junta."}, {"t": "2:30", "paso": "Crear huecos", "q": "¿Cómo haces el agujero para la anilla?", "opciones": ["Pongo un cilindro en modo «Hueco» y agrupo", "Borro un trozo con la goma", "Bajo la opacidad del aro"], "bien": 0, "explica": "Una forma en modo «Hueco» agrupada con la pieza la agujerea."}, {"t": "3:40", "paso": "Medir en milímetros", "q": "El llavero tiene que medir 5 cm de largo. ¿Qué escribes en Tinkercad?", "opciones": ["5", "50", "500"], "bien": 1, "explica": "Tinkercad mide en milímetros: 5 cm son 50 mm."}]}], "real": {"titulo": "Taxonomía de Bloom: qué es y ejemplos de aplicación", "donde": "Edpuzzle", "por_que": "Un vídeo con preguntas insertadas que comprueban la comprensión mientras se ve."}}, "L2": {"titulo": "Raúl (Matemáticas, 3.º ESO) reparte su sesión de sistemas de ecuaciones", "texto": "ANTES de clase (en casa):\n· Ven un vídeo de 5 minutos sobre el método de sustitución, con dos preguntas en Edpuzzle.\n· Resuelven un sistema guiado paso a paso.\n· Escriben su duda principal en un formulario de una sola pregunta.\n\nDURANTE la clase:\n· Resolvemos en la pizarra las tres dudas más repetidas del formulario.\n· Por parejas, plantean y resuelven dos problemas reales (entradas de cine, monedas).\n· Cada pareja explica un problema a otra y se corrigen entre sí.\n· Cierre: un ejercicio individual de salida, de 5 minutos."}, "A3": {"titulo": "Irene (Inglés, 5.º de Primaria) monta tres senderos hacia el mismo objetivo", "texto": "Irene creó un Genially con un solo objetivo: describir su rutina diaria en presente simple. En la portada hay tres puertas y cada estudiante elige una. «Hazlo»: ordena viñetas de un día y graba un audio contándolas. «Léelo»: lee un cómic corto y completa una tabla de horas y acciones. «Escúchalo»: escucha un pódcast de dos niños y responde con dibujos. Los tres caminos terminan en la misma tarea: escribir cinco frases sobre su propio día.", "detalle": ["Criterio: cada sendero es una actividad distinta, no la misma con otro nombre.", "Si no tienes una hora esta semana, vale un boceto a mano de los caminos, fotografiado."], "enlace": "https://view.genially.com/673a886db3cebc087dcc971a", "real": {"titulo": "(Math) Series niveladas", "donde": "Genially", "por_que": "Varias actividades para un mismo objetivo, y cada estudiante escoge su camino."}}, "B3": {"titulo": "Patricia rellena seis cruces de la matriz para «Las plantas» (3.º de Primaria)", "texto": "Patricia, maestra de 3.º de Primaria, contextualizó su unidad «Las plantas» (Ciencias de la Naturaleza, 8-9 años) con sus objetivos, contenidos y criterios de evaluación. Hizo la tabla 8×6 en Google Docs, con las inteligencias en filas y los niveles de Bloom en columnas, y rellenó seis casillas: una por cada nivel de Bloom y con seis inteligencias distintas. Cada actividad lleva objetivo, tarea del alumno, recurso, evaluación, tiempo y tipo. Las 42 casillas vacías quedan a la vista para completarlas más adelante.", "detalle": ["Naturalista × Recordar: nombra las partes de una planta del huerto con una ficha de fotos · lista de cotejo · 20 min · obligatoria.", "Lingüística × Comprender: explica en un audio de 1 minuto qué necesita una planta para vivir · rúbrica · 15 min · obligatoria.", "Lógico-matemática × Aplicar: mide cada dos días una judía que germina y lo anota en una tabla · hoja de registro · 2 semanas · obligatoria.", "Visual-espacial × Analizar: compara con fotos una planta al sol y otra a la sombra · escala de valoración · 30 min · optativa.", "Interpersonal × Evaluar: en equipo, deciden con tres criterios qué maceta está mejor cuidada · coevaluación · 30 min · optativa.", "Musical × Crear: inventa una canción corta sobre el ciclo de la planta con Chrome Music Lab · rúbrica · 45 min · voluntaria."], "enlace": "https://view.genially.com/5d3ebe3d5890ce0f65730f81", "vivo": [{"tipo": "tabla", "titulo": "Matriz de inteligencias múltiples × Bloom · «Las plantas» (3.º de Primaria)", "cab": ["", "Recordar", "Comprender", "Aplicar", "Analizar", "Evaluar", "Crear"], "filas": [["Lingüística", "", "Explica en un audio de 1 minuto qué necesita una planta para vivir", "", "", "", ""], ["Lógico-matemática", "", "", "Mide cada dos días una judía que germina y lo anota en una tabla", "", "", ""], ["Visual-espacial", "", "", "", "Compara con fotos una planta al sol y otra a la sombra", "", ""], ["Corporal", "", "", "", "", "", ""], ["Musical", "", "", "", "", "", "Inventa una canción corta sobre el ciclo de la planta (Chrome Music Lab)"], ["Interpersonal", "", "", "", "", "En equipo, deciden con tres criterios qué maceta está mejor cuidada", ""], ["Intrapersonal", "", "", "", "", "", ""], ["Naturalista", "Nombra las partes de una planta del huerto con una ficha de fotos", "", "", "", "", ""]], "nota": "Seis cruces: una por cada nivel de Bloom y en seis inteligencias distintas (las de sus puntos clave, abajo). Las 42 casillas vacías quedan a la vista para más adelante."}], "real": {"titulo": "(Gamificación) Paisaje de aprendizaje: El viaje del Endurance", "donde": "Genially", "por_que": "Un paisaje terminado: la matriz de este reto es la planificación que lo sostiene."}}, "L3": {"titulo": "Beatriz (Francés, EOI) explica itinerario y paisaje en cinco líneas", "texto": "Un itinerario de aprendizaje es una secuencia ordenada de actividades para llegar a un objetivo.\nPuede tener alguna bifurcación, pero el orden lo marca el docente y todos siguen un recorrido parecido.\nUn paisaje de aprendizaje ofrece muchas actividades a la vez, planificadas cruzando inteligencias múltiples y niveles de Bloom.\nEn el paisaje cada estudiante elige qué hace y en qué orden, entre tareas obligatorias, optativas y voluntarias.\nLa diferencia: el itinerario guía un recorrido; el paisaje abre varias opciones y atiende mejor a la diversidad."}, "X2": {"titulo": "Patricia entrega su paisaje de aprendizaje y lo marca en la Nave", "texto": "Patricia, maestra de 3.º de Primaria, amplió la matriz de su unidad «Las plantas» a ocho actividades y las llevó a un paisaje: una imagen interactiva en Genially (no una presentación) con un huerto ilustrado en el que cada planta abre una actividad, con un color según sea obligatoria, optativa o voluntaria. Su PDF (11 páginas, dentro del límite para ocho actividades) recoge la contextualización, la matriz y la ficha completa de cada actividad. En la Bitácora añadió la página «Actividad 2» con la matriz, el paisaje incrustado y un párrafo sobre cómo ese diseño atiende a la diversidad. Subió el PDF a la plataforma de UNIR y, al enviarlo, marcó «Lo he hecho» en la Nave con el enlace del paisaje y, con el «+», el de su Bitácora.", "detalle": ["PDF (80 %): contextualización, matriz 8×6 y ficha de cada actividad (objetivo, tarea, recursos citados, evaluación, tiempo y tipo).", "ePortfolio (20 %): evidencias de la matriz y del paisaje, más la justificación del diseño y de la atención a la diversidad.", "Se marca al ENVIAR la actividad, no al empezarla."], "imagen": "X2.jpg", "imagen_alt": "El paisaje de aprendizaje de Patricia: un huerto ilustrado con ocho plantas numeradas de colores y la ficha de la actividad 3 abierta."}, "A4": {"titulo": "Álvaro publica en LinkedIn su primer videoquiz, sin esperar a pulirlo", "texto": "Álvaro, profesor de Educación Física de 1.º de Bachillerato, publicó en LinkedIn, en abierto, una captura de su primer videoquiz con dos líneas: «Esta semana he convertido la explicación del salto de altura en un vídeo con preguntas para verlo antes de clase. No es perfecto, pero mi grupo ya lo está usando. #mutecdstargate». Tardó cinco minutos. Abrió la publicación, copió su enlace directo y lo pegó en el reto. Esa misma publicación le sirve después como evidencia en otros retos."}, "B4": {"titulo": "Daniel (Física y Química, 4.º ESO) monta su Classroom con tres recursos que ya existen", "texto": "Mi contenido llega al móvil a través de la app de Classroom: cada tarea y cada anuncio avisan con una notificación, y elijo recursos que se ven bien en pantalla pequeña (vídeos cortos y una simulación que funciona en el navegador del móvil). Las instrucciones caben en tres líneas, no en un PDF. La conversación la mantengo viva así: cada lunes publico en el tablón una pregunta de la semana, respondo a los comentarios de clase en menos de 24 horas y en cada práctica dejo un comentario privado a cada estudiante. Cuando una duda se repite, la respondo en el tablón para todos.", "detalle": ["Aula «Física y Química 4.º B» con una tarea publicada: «Práctica: densidad de sólidos irregulares», con fecha y rúbrica.", "Tablón abierto a comentarios y un anuncio de bienvenida.", "Tres recursos ajenos, cada uno con dos líneas de por qué ese y su fuente: la simulación «Densidad» de PhET (Universidad de Colorado, CC BY 4.0), un vídeo divulgativo de YouTube sobre el principio de Arquímedes (canal citado) y un juego de Educaplay de otro docente sobre unidades (autor citado).", "Google Doc con permiso de lectura y dos capturas (el tablón y la tarea): su enlace va en el reto."], "imagen": "B4.jpg", "imagen_alt": "El tablón de Classroom «Física y Química 4.º B» con la pregunta de la semana y una tarea con tres recursos citados."}, "L4": {"titulo": "Mónica descubre en incógnito que su rúbrica pedía permiso", "texto": "Mónica, maestra de Educación Infantil, eligió la rúbrica que había hecho en Google Docs. Copió el enlace, abrió una ventana de incógnito (Ctrl + Mayús + N en Chrome) y le salió «Necesitas permiso». En el documento pulsó «Compartir», cambió «Restringido» por «Cualquier persona con el enlace» con el rol «Lector» y volvió a probar: ahora se abría sin iniciar sesión. Hizo la captura con la ventana de incógnito y el documento a la vista y la pegó en el reto. Cinco minutos.", "imagen": "L4.jpg", "imagen_alt": "La rúbrica de Mónica abierta en una ventana de incógnito de Chrome, sin sesión iniciada."}, "A5": {"titulo": "Laura (Inglés, 2.º ESO) hace una rúbrica de 4 criterios con descripciones observables", "texto": "Laura eligió un objetivo que ya trabaja: «Presentar oralmente su ciudad durante dos minutos». Hizo en Google Docs una tabla con 4 criterios (contenido, vocabulario, fluidez y pronunciación) y 4 niveles (Inicial, En proceso, Conseguido y Destacado). En cada casilla escribió lo que se ve o se oye, no un adjetivo: en vez de «buen vocabulario», «usa 8 o más palabras de la unidad sin repetir». La compartió como «Cualquier persona con el enlace · Lector», se la pasó a una compañera para ver si podía usarla sin preguntarle y pegó el enlace en el reto.", "detalle": ["Contenido · Destacado: nombra 4 o más lugares y da un dato de cada uno. Inicial: nombra 1 lugar, sin datos.", "Fluidez · Destacado: habla dos minutos con 2 pausas largas como máximo. Inicial: lee casi todo del papel.", "Sin adjetivos sueltos («bien», «adecuado»): si no se puede observar, no se puede medir."], "vivo": [{"tipo": "tabla", "titulo": "Rúbrica · Presentar oralmente su ciudad durante dos minutos (Inglés, 2.º ESO)", "cab": ["Criterio", "Inicial", "En proceso", "Conseguido", "Destacado"], "filas": [["Contenido", "Nombra 1 lugar, sin datos", "Nombra 2 lugares y da un dato de uno", "Nombra 3 lugares y da un dato de cada uno", "Nombra 4 o más lugares y da un dato de cada uno"], ["Vocabulario", "Usa menos de 4 palabras de la unidad", "Usa de 4 a 7 palabras de la unidad", "Usa 8 o más palabras de la unidad sin repetir", "Usa 8 o más y 2 expresiones nuevas de la unidad"], ["Fluidez", "Lee casi todo del papel", "No llega a 2 minutos o para muchas veces", "Habla 2 minutos con 3 o 4 pausas largas", "Habla 2 minutos con 2 pausas largas como máximo"], ["Pronunciación", "No se entiende más de la mitad", "Se entiende con esfuerzo en varias frases", "Se entiende todo, con algún error", "Se entiende todo y cuida la entonación de las preguntas"]], "nota": "Cada casilla dice lo que se ve o se oye, no un adjetivo: «usa 8 o más palabras», no «buen vocabulario»."}]}, "B5": {"titulo": "Laura monta en Google Sites el centro de recursos de Inglés de 2.º ESO", "texto": "Laura creó en Google Sites «English Hub · 2.º ESO» con un menú de cinco páginas: Inicio, Unidad 1, Unidad 2, Unidad 3 y «Cómo se evalúa». Cada unidad tiene sus recursos (un vídeo con preguntas, un juego de Wordwall, una ficha de vocabulario), cada uno con una línea que dice para qué sirve. En «Cómo se evalúa» incrustó la rúbrica de la exposición oral que hizo en el reto anterior. Comprobó el enlace en incógnito y lo pegó en el reto. En su Bitácora añadió la entrada «Centro de recursos»: evidencia (el enlace), contexto (grupo y uso) y reflexión (qué cambia al tenerlo todo en un sitio). Esa misma semana cerró allí su página de la Actividad 1.", "detalle": ["Web no es aula virtual: aquí no se entregan tareas; el alumnado encuentra los recursos sin pedirlos.", "Organizada con criterio: por unidad (también valdría por tipo de recurso).", "La rúbrica, a la vista en su propia página, no escondida tras un enlace."], "pua": "En PUA este reto recupera también a Vera y no hay reto anterior de rúbrica: la rúbrica (3-4 criterios con descripciones observables) se hace aquí mismo.", "imagen": "B5.jpg", "imagen_alt": "El sitio «English Hub · 2.º ESO» con su menú de cinco páginas y la rúbrica incrustada en «Cómo se evalúa»."}, "L5": {"titulo": "Paula crea en Google Forms tres preguntas de autoevaluación sobre el feudalismo", "texto": "Paula, profesora de Geografía e Historia de 2.º de ESO, abrió Google Forms en modo cuestionario, con la puntuación y las respuestas visibles al enviar. Escribió una pregunta por cada objetivo de la unidad: 1) ¿Qué estamento trabajaba la tierra? (opción múltiple). 2) Relaciona señor y vasallo con sus obligaciones (cuadrícula). 3) ¿Por qué un campesino aceptaba depender de un señor? (respuesta corta, con una respuesta modelo como comentario). Lo insertó en su Bitácora (Google Sites → Insertar → Formularios) y pegó el enlace en el reto. Doce minutos.", "vivo": [{"tipo": "quiz", "titulo": "Pruébalo: las tres preguntas de Paula", "preguntas": [{"q": "1 · ¿Qué estamento trabajaba la tierra?", "opciones": ["La nobleza", "El clero", "El campesinado", "La realeza"], "bien": 2, "explica": "El campesinado trabajaba la tierra y pagaba rentas al señor."}, {"q": "2 · ¿Qué debía el vasallo a su señor?", "opciones": ["Protección y un feudo", "Fidelidad y ayuda militar", "Nada: eran iguales"], "bien": 1, "explica": "El vasallo juraba fidelidad y ayuda militar; el señor le daba protección y un feudo. (En Forms es una cuadrícula con los dos.)"}, {"q": "3 · ¿Por qué un campesino aceptaba depender de un señor?", "abierta": true, "explica": "Respuesta modelo: porque a cambio recibía protección frente a ataques y tierra para cultivar, en una época sin un poder central fuerte."}], "nota": "En Forms, en modo cuestionario, con la puntuación y las respuestas visibles al enviar: la autoevaluación se corrige sola."}]}, "A6": {"titulo": "Ramón repasa 15 minutos y gana al Simulador a la segunda", "texto": "Ramón, profesor de FP Básica, se preparó 15 minutos antes de entrar: repasó sus notas de los temas 1 al 5 y se apuntó los pares que más se confunden (itinerario y paisaje, videotutorial y videoquiz, aula virtual y web de recursos, ABJ y gamificación). La primera partida la perdió por contestar despacio. En la segunda respondió sin apurar los 25 segundos, guardó «reparar escudo» para cuando su escudo iba bajo y llegó al Remate sin fallos pendientes. No tuvo que entregar nada: la insignia se registró sola.", "vivo": [{"tipo": "tabla", "titulo": "Los pares que Ramón se apuntó (los que más se confunden)", "cab": ["Se confunde…", "…con", "La diferencia"], "filas": [["Itinerario", "Paisaje", "El itinerario es una secuencia que ordena el docente; en el paisaje hay muchas actividades a la vez (inteligencias × Bloom) y cada estudiante elige cuáles y en qué orden."], ["Videotutorial", "Videoquiz", "El videotutorial explica paso a paso cómo hacer algo; el videoquiz es un vídeo con preguntas dentro que hay que responder para seguir."], ["Aula virtual", "Web de recursos", "El aula virtual tiene alumnado inscrito, tareas, entregas y notas; la web de recursos ordena materiales para consultarlos."], ["ABJ", "Gamificación", "En el ABJ se aprende jugando a un juego; en la gamificación se usan elementos de juego (puntos, insignias, historia) en algo que no es un juego."]]}]}, "B6": {"titulo": "Carlos (Química, 1.º Bachillerato): escape de formulación en tres fases", "texto": "Mi juego cubre este objetivo: nombrar y formular compuestos inorgánicos binarios y ternarios según la IUPAC. Es un escape en Genially con tres fases, y cada una sube la dificultad: en la primera se reconocen óxidos e hidruros; en la segunda hay que nombrar sales binarias; en la tercera, formular oxoácidos a partir de su nombre. Cada fase da un dígito del candado final, así que no se avanza sin acertar. Lo evalúo con un Google Forms al final, donde cada equipo escribe el código y cuántos intentos le costó cada fase, y con una lista de cotejo mientras juegan: así veo en qué fase se atascan y qué tengo que repasar.", "detalle": ["Hecho en Genially con una plantilla de escape: portada, tres salas y candado final.", "Cada mecánica sirve a un aprendizaje: sin nombrar bien el compuesto, la puerta no se abre.", "Enlace público del Genially en el reto; la reflexión, en la caja y en su Bitácora."], "imagen": "B6.jpg", "imagen_alt": "La fase 3 del escape de formulación de Carlos: un laboratorio con un candado de tres dígitos y la consigna «Formula el ácido sulfúrico»."}, "L6": {"titulo": "Marta justifica su videotutorial de Tinkercad según el aula invertida", "texto": "Recurso: videotutorial de Tinkercad con tres preguntas en Edpuzzle (3.º ESO).\nMetodología: aula invertida.\nSe ve en casa, antes de la sesión, al ritmo de cada estudiante.\nLas preguntas comprueban que ha entendido cada paso antes de seguir.\nEdpuzzle me dice quién lo ha visto y qué pregunta se falla más.\nCon eso empiezo la clase resolviendo solo las dudas reales.\nEl tiempo de aula se dedica a diseñar e imprimir, conmigo al lado.\nVídeo y no PDF: el procedimiento se entiende mejor viéndolo.\nEdpuzzle y no YouTube a secas: sin preguntas no sabría quién lo sigue.\nAporta autonomía, respeta los ritmos y deja más práctica guiada en clase."}, "A7": {"titulo": "Rocío (5.º de Primaria) crea la insignia «Guardianes de la biblioteca»", "texto": "Se llama «Guardianes de la biblioteca». Reconoce al equipo que cada viernes deja la biblioteca de aula ordenada, con los libros revisados y las fichas de préstamo al día. En nuestra historia de clase, esos libros son el archivo de todas las aventuras que hemos leído: si se pierden o se rompen, el lunes nadie puede seguir la suya. No premia obedecer: recuerda que cuidar lo que es de todos es cuidar a los compañeros.", "detalle": ["Diseñada en Canva: escudo azul con un libro abierto y una llave.", "Compartida con el enlace de solo lectura de Canva y publicada en el padlet de la clase."], "imagen": "A7.jpg", "imagen_alt": "La insignia «Guardianes de la biblioteca»: un escudo azul y dorado con un libro abierto y una llave."}, "B7": {"titulo": "Ana (FP de Cuidados Auxiliares de Enfermería) convierte el registro diario en un turno de guardia", "texto": "Mi microgamificación refuerza una conducta concreta: rellenar cada día, completa y sin errores, la hoja de registro de las prácticas. Nadie juega: la tarea es la de siempre. La envuelve una historia: mi grupo es el equipo de guardia del «Hospital Aurora» y cada registro bien hecho es un paciente atendido a tiempo. En un tablero de Genially cada equipo tiene la barra de progreso de su turno, y con cinco días seguidos sin errores gana la insignia «Turno impecable». Lo hago así porque en su trabajo real un registro incompleto tiene consecuencias, y la historia les ayuda a verlo antes de salir a las prácticas.", "detalle": ["Tablero en Genially: una barra por equipo que avanza con cada registro que valida la profesora.", "Insignia «Turno impecable» al quinto día seguido sin errores.", "No es ABJ: no hay un juego que jugar, solo elementos de juego (historia, progreso e insignia) sobre una tarea real."], "imagen": "B7.jpg", "imagen_alt": "El tablero «Hospital Aurora · Equipo de guardia» con la barra de cada equipo y la insignia «Turno impecable»."}, "L7": {"titulo": "Pedro hace una tabla de los equipos que más han mejorado", "texto": "Pedro, profesor de Educación Física de 1.º de ESO, no quería premiar solo al más rápido. En Google Sheets hizo una tabla de cinco filas, una por equipo, con tres columnas: marca media en la primera prueba de 1.000 metros, marca media actual y porcentaje de mejora. La ordenó por la mejora y añadió formato condicional para que el primer puesto salga en verde. Así, arriba va el equipo que más ha progresado, aunque no sea el más rápido. Hizo la captura y la pegó en el reto. Diez minutos.", "imagen": "L7.jpg", "imagen_alt": "La hoja de cálculo de Pedro con cinco equipos ordenados por su mejora en los 1.000 metros y el primero en verde."}, "A8": {"titulo": "Clara (Geografía e Historia, 1.º ESO) trae al aula un Coliseo en 3D", "texto": "Usaría un modelo 3D del Coliseo publicado en Sketchfab, que desde el móvil se puede colocar sobre la mesa en realidad aumentada. Sería en 1.º de ESO, en la unidad de Roma. Por parejas, el alumnado lo giraría y se acercaría a las gradas, la arena y las entradas, y dibujaría un plano sencillo con el lugar donde se sentaba cada grupo social. Esa capa añade lo que el libro no da con una foto: el tamaño, la estructura por dentro y la posibilidad de compararlo con un estadio que conocen.", "detalle": ["En el reto va el enlace al modelo: aquí no se construye nada, se elige un recurso que ya existe.", "Se cita el autor del modelo y su licencia, que aparecen en la propia ficha de Sketchfab."]}, "B8": {"titulo": "Lucía crea una lámina con RA y publica su Bitácora completa", "texto": "Lucía, la profesora de Biología y Geología de 3.º de ESO que abrió su Bitácora en la semana 1, hizo su experiencia de realidad aumentada con una lámina del aparato digestivo: junto a cada órgano hay un código QR que abre en el móvil un modelo 3D de ese órgano (de Sketchfab, con su autor citado) o un vídeo suyo de 40 segundos. La imprimió en A3 para la pared del aula y la usó como reto libre. Después cerró la Bitácora: convirtió su paisaje de la Actividad 2 en una imagen interactiva de Genially incrustada en su página, revisó que las cinco páginas estuvieran completas (Actividad 1, Actividad 2, videotutorial, microgamificación y reto libre), lo abrió todo en incógnito y pegó el enlace único en el reto.", "detalle": ["Cada página sigue el mismo patrón: evidencia → contexto → reflexión.", "Probó los QR con dos móviles distintos antes de imprimir la lámina.", "Un solo enlace, el de la Bitácora, que lleva a todo lo demás."], "imagen": "B8.jpg", "imagen_alt": "La lámina del aparato digestivo con un QR junto a cada órgano y un móvil que muestra el estómago en 3D."}, "L8": {"titulo": "Víctor mete en una diapositiva el QR de su juego sobre la orquesta", "texto": "Víctor, profesor de Música de 2.º de ESO, abrió en Chrome el enlace público de su juego de Wordwall sobre las familias de instrumentos y generó el QR con el botón derecho → «Crear código QR para esta página». Lo pegó en una diapositiva de Google Slides titulada «Escanea y juega: la orquesta», lo escaneó con su móvil para comprobar que abría el juego y, con la pantalla partida, hizo una captura con la diapositiva a la izquierda y el juego abierto a la derecha, con su dirección visible. La pegó en el reto. Ocho minutos.", "imagen": "L8.jpg", "imagen_alt": "A la izquierda, la diapositiva «Escanea y juega: la orquesta» con su QR; a la derecha, el juego de Wordwall abierto con su dirección."}, "XS": {"titulo": "Isabel monta su plataforma «EXPLORA» en 90 minutos", "texto": "Isabel, maestra de 6.º de Primaria, recibió un caso: una plataforma para preparar una salida al entorno natural. Minutos 0-15: un Google Sites con portada, el logo hecho en Canva con la palabra clave que pedía el caso, «EXPLORA», y cinco líneas que explican el enfoque. Minutos 15-40: Módulo 1 (antes de la salida), con su videoquiz reutilizado del tema 2 y un cuestionario de autoevaluación de tres preguntas creado en el momento. Minutos 40-65: Módulo 2 (durante la salida), con un juego de Wordwall creado en directo y su QR dentro de una lámina. Minutos 65-78: justificación de diez líneas según el ABP. Minutos 78-90: todos los enlaces abiertos en incógnito, capturas y repaso de ortografía. Al terminar, pegó el enlace público y subió las capturas.", "detalle": ["¿El logo lleva la palabra clave?", "¿Se abre todo en una ventana de incógnito?", "¿Hay dos módulos y tres productos?", "¿La justificación cabe en diez líneas?", "¿Hay capturas y se ha repasado la ortografía?"], "imagen": "XS.jpg", "imagen_alt": "La portada de «EXPLORA» en Google Sites: el logo, cinco líneas de presentación y los botones «Módulo 1 · Antes» y «Módulo 2 · Durante»."}}, "retos": {"A0": ["A0", "Reto «Preséntate a tu tripulación» (vídeo de 60 s)", ["E1_nebula"], 100, 1], "A1": ["A1", "Reto A «El boceto sin quemar» (recupera a Bran)", ["P1_bran"], 100, 1], "B1": ["B1", "Reto B «La Bitácora en marcha» (tu ePortfolio)", ["R0_bitacora-en-marcha"], 250, 1], "L1": ["L1", "Reto relámpago «La chispa y la marca» (imagen con IA + logo)", ["R1_la-chispa"], 60, 1], "X1": ["X1", "Actividad 1 entregada (imagen con IA)", ["H2_primera-forja", "E2_capitan"], 500, 1], "A2": ["A2", "Reto A «Un mensaje para quien faltó» (recupera a Tomás)", ["P2_tomas"], 100, 2], "B2": ["B2", "Reto B «El eco que enseña» (videotutorial + videoquiz)", ["R2_el-eco-que-ensena"], 250, 2], "L2": ["L2", "Reto relámpago «Módulo 1 y módulo 2» (antes y durante la clase)", [], 60, 2], "A3": ["A3", "Reto A «Dos senderos» (recupera a Sylla)", ["P3_sylla"], 100, 3], "B3": ["B3", "Reto B «La matriz» (matriz 8×6)", ["R3_la-matriz"], 250, 3], "L3": ["L3", "Reto relámpago «Cinco líneas que explican» (itinerario y paisaje)", [], 60, 3], "X2": ["X2", "Actividad 2 entregada (paisaje de aprendizaje)", ["H3_cartografo"], 500, 3], "A4": ["A4", "Reto A «Abre el canal» (recupera a Amara)", ["P4_amara"], 100, 4], "B4": ["B4", "Reto B «El entorno de aula» (aula virtual + tres recursos que ya existen)", ["R4_entorno-de-aula"], 250, 4], "L4": ["L4", "Reto relámpago «Enlace en incógnito» (que se vea sin tu cuenta)", [], 60, 4], "A5": ["A5", "Reto A «Mide con método» (recupera a Vera)", ["P5_vera"], 100, 5], "B5": ["B5", "Reto B «La Bitácora medida» (web de recursos + rúbrica)", ["R5_bitacora-medida"], 250, 5], "L5": ["L5", "Reto relámpago «Tres preguntas» (autoevaluación)", [], 60, 5], "A6": ["A6", "Reto A «El Simulador de Joran» (recupera a Joran)", ["P6_joran"], 100, 6], "B6": ["B6", "Reto B «El juego» (juego digital)", ["R6_el-juego"], 250, 6], "L6": ["L6", "Reto relámpago «Las diez líneas» (justifica un recurso)", [], 60, 6], "A7": ["A7", "Reto A «Un porqué» (recupera a Mara)", ["P7_mara"], 100, 7], "B7": ["B7", "Reto B «La microgamificación»", ["R7_microgamificacion"], 250, 7], "L7": ["L7", "Reto relámpago «El marcador» (tabla de clasificación)", [], 60, 7], "A8": ["A8", "Reto A «La capa posible» (recupera a Noa)", ["P8_noa"], 100, 8], "B8": ["B8", "Reto B «El último umbral» (RA/RV + Bitácora publicada)", ["R8_ultimo-umbral"], 250, 8], "L8": ["L8", "Reto relámpago «El QR» (un QR dentro de una lámina)", [], 60, 8], "XS": ["XS", "Reto «El simulacro del examen» (90 minutos de reloj)", ["H7_listo-para-la-batalla"], 300, 8]}, "consignas": {"A0": "Graba un vídeo de MÁXIMO 60 segundos presentándote al resto de la tripulación y publícalo en la sección «Preséntate» del padlet de la clase (título = tu alias; primera línea = «Capitán: tu profe»). No hace falta guion de cine — si te da apuro, responde a tres o cuatro de estas: ¿quién eres y a qué te dedicas? ¿desde dónde te conectas? ¿por qué educación? ¿una herramienta que ames y una que sufras? ¿un dato curioso que nadie adivinaría? Grábalo del tirón con el móvil: natural gana a perfecto. Después copia el enlace de TU publicación (los tres puntos ⋮ → «Copiar el enlace a la publicación») y pégalo aquí. Sirve para ponernos cara desde el primer día — y NEBULA te da su insignia: lo que se comparte no se apaga.", "A1": "Saca del cajón algo que tengas a medias —o que dejaste a medias— tal como está: un recurso, una unidad, una idea que se quedó ahí. Escríbelo aquí mismo, en la caja del reto: qué es, en qué punto se quedó y qué te frenó para terminarlo. Si puedes, añade el enlace al propio archivo (con permiso de lectura). Tu tripulación leerá lo que escribas —y tú lo suyo—: no se corrige ni se puntúa; el único criterio es sacarlo del cajón y compartirlo sin terminar.", "B1": "El curso entero termina en un ePortfolio, así que se empieza por él. (1) Crea tu Bitácora en la plataforma que quieras —Google Sites, Genially, Wix, un blog…— o pon a punto la que ya tengas; hay una plantilla oficial en Genially por si quieres atajar. (2) Personalízala: color, tipografía, una imagen tuya. (3) Publica su primera entrada: tu presentación — quién eres, qué y dónde enseñas, y qué esperas de este viaje. (4) Comprueba que el enlace es público (ábrelo en una ventana de incógnito) y pégalo aquí y en tu BIO de la Nave, para que tu tripulación pueda visitarla. No hace falta que esté llena: hace falta que exista y se pueda visitar. Lo demás lo irán llenando los retos, semana a semana, hasta la Actividad 1.", "L1": "Diez o quince minutos, en clase. (1) Genera con una IA una imagen con finalidad didáctica (ilustración, organizador gráfico o infografía): prompt estructurado siguiendo un modelo tipo CRAFT/RITA (contexto educativo + tipo de imagen + finalidad), al menos una iteración y la elección final con tu criterio docente dicho en dos líneas. (2) Y de paso, un logo que lleve una palabra clave dentro (la que tú quieras: será tu marca). Los dos van a la portada de tu Bitácora. Pega aquí el enlace o una captura. Es la tabla técnica de la Actividad 1: guárdala, ya tienes hecho su núcleo — y el logo con palabra clave es exactamente lo que te van a pedir el día del examen.", "X1": "La Actividad 1 entregada donde te la pide tu profesor. Pulsa «Lo he hecho» cuando la hayas ENVIADO, no cuando la empieces, y pega el enlace o los enlaces que compartiste en tu actividad (es obligatorio; el «+» añade un segundo).", "A2": "Graba un clip corto (máx. 60 s) explicando un concepto como si se lo contaras a un alumno que hoy no pudo venir a clase. Súbelo donde quieras (YouTube en oculto, Drive con permiso de lectura, el padlet de la clase…) y pega su enlace. Criterio único: que funcione sin ti delante (se entiende solo).", "B2": "Crea un videotutorial de calidad (guion + grabación de pantalla + edición) sobre un procedimiento de tu área, y enriquécelo con 2–3 preguntas insertadas (videoquiz) para comprobar comprensión. Piénsalo para aula invertida. Pega su enlace y escribe aquí mismo, en la caja del reto, una reflexión breve: qué objetivo didáctico cubre y qué aprendiste al hacerlo (llévala también a tu Bitácora).", "L2": "Diez o quince minutos, en clase. Coge una sesión tuya —la que vas a dar la semana que viene vale— y repártela en dos listas: qué hace tu alumnado antes de clase (lo que ve, lee o practica por su cuenta) y qué hacéis durante la clase (lo que solo tiene sentido con todos delante). Nada más: dos listas, escritas aquí mismo, en la caja del reto. Es el esqueleto del aula invertida… y el esqueleto de la respuesta del examen, que siempre pide dos módulos.", "A3": "(Este cuesta cerca de una hora: no es una píldora de quince minutos. Si esta semana no tienes ese hueco, vale un boceto a mano de los dos caminos, fotografiado.) Crea un artefacto interactivo (un Genially o similar) con una bifurcación: un objetivo de aprendizaje y dos o tres actividades distintas para alcanzarlo, y que cada estudiante elija su sendero al empezar (p. ej. uno que aprende haciendo, otro leyendo, otro escuchando). Pega su enlace. Criterio: que cada sendero sea una actividad de verdad —no la misma con otro nombre— y que todos lleguen a la misma cima.", "B3": "Construye la matriz de programación de un paisaje de aprendizaje: una tabla de doble entrada que cruza las 8 inteligencias múltiples × 6 niveles de Bloom (48 casillas). Contextualiza una unidad didáctica real (nivel, área, objetivos) y rellena al menos 6 cruces variados en complejidad y en talento, con una actividad en cada uno (objetivo, tarea del alumno, recurso, evaluación, tiempo, tipo: obligatoria/optativa/voluntaria). Es el corazón de planificación de la Actividad 2.", "L3": "Diez o quince minutos, en clase. Escribe con tus palabras —sin copiar de ningún sitio— qué es un itinerario de aprendizaje y en qué se diferencia de un paisaje. Cinco líneas, ni una más, escritas aquí mismo, en la caja del reto: de ahí van a la portada de tu Bitácora, donde se explica de qué va todo esto. Parece poca cosa: es justo lo que se pide en la portada del examen, y ahí vale punto y medio.", "X2": "La Actividad 2 entregada donde te la pide tu profesor. Igual: al ENVIARLA, y pega el enlace o los enlaces que compartiste en tu actividad (es obligatorio; el «+» añade un segundo).", "A4": "Publica en tus redes (X, LinkedIn, Instagram…) una reflexión breve o un recurso del curso con el hashtag #mutecdstargate, en abierto. Vale un hilo corto, una imagen con dos líneas o el enlace a algo que hayas creado. Y guárdate el truco: una reflexión publicada con ese hashtag es evidencia válida también en otros retos de este viaje. Criterio: a tiempo por encima de perfecto — se publica hoy, se pule mañana.", "B4": "Monta tu aula virtual (Google Classroom, Moodle, Teams…): crea el aula, publica al menos una tarea o un material para tu alumnado y deja funcionando el canal de feedback y comunicación (tablón, comentarios, anuncios). Y ahora la otra mitad del oficio, la que casi nadie practica: publica en esa aula tres recursos que YA EXISTAN —un juego, un vídeo y una actividad interactiva que haya hecho otra persona—, cada uno con dos líneas de por qué ese y no otro y con su fuente o licencia citada. Crear está bien; encontrar rápido lo que ya está hecho, y saber si vale, es la mitad del trabajo de un docente… y el día del examen, media hora ganada. Comparte un Google Doc con permiso de lectura con al menos 2 capturas de pantalla de tu aula y pega su enlace. Y aquí mismo, en la caja del reto, tu reflexión breve: cómo llega tu contenido al móvil del alumno y cómo mantienes la conversación viva. (La web de recursos es el reto del tema 5: aquí montas el AULA.)", "L4": "Diez minutos, en clase. Coge un recurso tuyo de los que ya has hecho, compártelo, ábrelo en una ventana de incógnito (sin tu cuenta) y sube la captura de que se ve. Si no se ve, arregla los permisos y repite. Pega aquí la captura. Es el reto más corto del viaje y probablemente el que más nota salva: en el examen, un enlace que no es público anula la actividad, y si es el de la web, suspende la prueba entera.", "A5": "Elige un objetivo de aprendizaje que ya trabajes y crea una rúbrica para evaluarlo: 3 o 4 criterios, 3 o 4 niveles de logro y, en cada casilla, una descripción observable (qué hace el alumno, no un adjetivo). Compártela en un documento con permiso de lectura (Google Docs, Sheets, CoRubric…) y pega su enlace. Criterio: que otra persona pudiera usarla sin preguntarte — medir para cuidar, no para etiquetar.", "B5": "Monta el centro de recursos de tu alumnado: una web (Google Sites o un Genially) con al menos 3 recursos organizados con criterio (por unidad o por tipo), navegación clara y una página de cómo se evalúa, con tu rúbrica del reto anterior a la vista. Es el ESCAPARATE, distinto del aula virtual del tema 4: aquí el estudiante encuentra todo sin tener que pedirlo. Pega su enlace y enlázala desde tu ePortfolio (una entrada con evidencia → contexto → reflexión). Esta semana además cierras la Actividad 1 dentro de la Bitácora.", "L5": "Diez o quince minutos, en clase. Monta un cuestionario de autoevaluación de tres preguntas sobre algo que ya hayas enseñado (Forms, Kahoot, Quizizz, H5P… lo que uses), y enlázalo o embébelo en tu Bitácora. Tres preguntas bien alineadas con lo que querías que aprendieran valen más que veinte al azar. Pega aquí el enlace. En el examen te lo van a pedir con estas mismas palabras: «un cuestionario digital de autoevaluación, con tres preguntas alineadas al contenido».", "A6": "Joran dejó encendido su simulador de entrenamiento: RUTA AZUL, un rival hecho de luz que pregunta por todo lo que llevas recorrido (temas 1 al 5). Entra desde el botón del reto en tu Nave y gánale: no hay nada que entregar, se registra solo al vencerlo. Cómo se pelea: aciertas y eliges golpear o cubrirte; fallas y no pierdes escudo, pierdes tiempo (y esa pregunta vuelve). El rival ataca cada 25 segundos, así que responde sin dormirte. Llevas un kit de un uso: reparar el escudo, sobrecargar tu golpe e interferir su ataque. Cuando esté al 20 % llega el Remate: sin fallos cae de un golpe; con fallos, vuelven en cadena y hay que redimirlas. Si pierdes, vuelve a intentarlo: cada derrota lo cansa y ataca más despacio. Al ganar te llevas la insignia de Joran y el Simulador se queda en tu Nave para repasar tema a tema, con su ranking.", "B6": "Adapta un juego existente o crea uno digital a medida para un objetivo concreto de tu aula, algo más elaborado que un quiz suelto: con varios niveles de dificultad o varias formas de jugarlo (ruleta + preguntas, un escape por fases, un tablero con caminos…). En ABJ el juego ES la actividad: cada mecánica debe servir a un aprendizaje. Pega el enlace al juego y escribe aquí mismo, en la caja del reto, tu reflexión: qué objetivo cubre, qué cambia de un nivel a otro y cómo lo evalúas (y súbelo a tu Bitácora).", "L6": "Diez o quince minutos, en clase. Coge un recurso que ya hayas creado en este viaje y justifícalo según una metodología concreta (ABJ, aula invertida, ABP, aprendizaje colaborativo…): qué aporta al aprendizaje, en qué momento se usa y por qué ese recurso y no otro. Diez líneas exactas, ni una más — la limitación es parte del ejercicio. Escríbelo aquí mismo, en la caja del reto. En el examen esa justificación vale entre dos y tres puntos, y tiene ese mismo límite de diez líneas.", "A7": "Toma una tarea rutinaria de tu aula y crea la insignia que la reconoce: diséñala (con Genially, Canva, una IA o a mano) y pega su enlace. Y aquí mismo, en la caja del reto, escribe su «porqué» en 2–4 líneas: cómo se llama, qué acto significativo reconoce y la narrativa que convierte esa tarea en una causa —no un premio por obedecer, sino memoria de algo que importa.", "B7": "Diseña una microgamificación de calidad: un toque de juego sobre una tarea que no es un juego y, sobre todo, la capa narrativa que la envuelve: quién es el alumnado en esa historia, qué misión tiene y por qué importa (una insignia, una barra de progreso o un tablero, pero dentro de un relato). Distíngue bien de ABJ: aquí no se juega, se toman elementos del juego para enganchar. Pega el enlace al recurso y escribe aquí mismo, en la caja del reto, tu reflexión: qué conducta refuerza, qué historia la envuelve y por qué (y súbelo a tu Bitácora).", "L7": "Diez minutos, en clase. Monta una tabla de clasificación sencilla para una dinámica de tu aula: una hoja de cálculo, un Genially, lo que sea. Con cinco filas basta. Piensa qué mides (no tiene por qué ser quién va primero: puede ser quién ha ayudado más, o qué equipo ha mejorado). Pega aquí el enlace o la captura. Es la L de «PBL: points, badges, leaderboards» — lo único del trío que no fabricas en ningún otro reto, y que el examen pide crear.", "A8": "Busca un recurso de realidad aumentada o virtual QUE YA EXISTA (una app, una experiencia AR, un modelo 3D, un tour virtual…) y pega su enlace. Después, aquí mismo, en la caja del reto, cuenta en 3–4 líneas cómo lo usarías en una clase concreta: qué vería el alumnado, qué haría y qué añade esa «capa» que no da el libro. Aquí no se construye nada: se elige bien — no toda capa se levanta; algunas ya existen y solo esperan a que alguien las traiga al aula.", "B8": "(1) Crea una experiencia de Realidad Aumentada o Virtual para tu materia: puede ser tan sencilla como un código QR que abre un modelo 3D o un vídeo sobre una lámina, o tan elaborada como una escena VR para practicar sin riesgo. Puede ser tu reto libre del ePortfolio. (2) Termina y publica la Bitácora: convierte tu paisaje de aprendizaje (Act 2) en una imagen interactiva publicada, revisa que las 5 páginas estén completas (Act 1, Act 2, videotutorial, microgamificación, reto libre) y pega el enlace único.", "L8": "Diez minutos, en clase. Genera un código QR que abra un recurso tuyo (tu juego, tu Bitácora, tu vídeo), mételo dentro de una lámina o una presentación y haz la captura donde se vea todo: la lámina, el QR y adónde lleva. Pega aquí la captura. Un modelo de examen lo pide con estas palabras: «un código QR creado durante el examen de acceso a un juego digital educativo». Vale un punto y se hace en diez minutos… si lo has hecho antes una vez.", "XS": "El ensayo general, con el reloj de verdad: 90 minutos para resolver un caso como el del examen. Se hace en la clase de repaso (semana 15). Se te dará un planteamiento y tendrás que montar, EN ESE RATO, una plataforma digital (web o Genially) con su portada, su logo con la palabra clave, dos módulos y tres productos digitales —algunos puedes reutilizarlos de los que ya has hecho en el viaje: para eso está tu Arsenal—. Al terminar, pega aquí el enlace público y sube tus capturas. No lleva nota: lleva una lista de comprobación que repasas tú mismo delante de todos (¿el logo lleva la palabra?, ¿se abre en incógnito?, ¿hay dos módulos?, ¿tres productos?, ¿la justificación cabe en diez líneas?). Nadie sabe lo que son noventa minutos hasta que los vive."}, "planetas": [["p1_forge", "Fôrge", "T1 · Contenido multimedia"], ["p2_ecos", "Ecos", "T2 · El vídeo"], ["p3_sendara", "Sendara", "T3 · Interactivos"], ["p4_reliae", "Reliae", "T4 · M-learning"], ["p5_umbral", "Umbral", "T5 · Evaluación"], ["p6_ludo", "Ludo", "T6 · ABJ"], ["p7_vinculo", "Vínculo", "T7 · Gamificación"], ["p8_liminar", "Liminar", "T8 · RA/RV"]], "reflexion": ["A1", "B2", "B4", "B6", "A7", "B7", "A8", "L2", "L3", "L6"]};</script>
